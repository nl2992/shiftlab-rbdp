[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftlab-rbdp"
version = "0.1.0"
description = "Risk-Budget Dynamic Programming for Causal-Null-Safe Model Promotion"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7", "pydantic>=2.7", "pyyaml>=6", "pyarrow>=18", "requests>=2.32", "psutil>=6", "tabulate>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]
drift = ["river>=0.21"]
neural = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
